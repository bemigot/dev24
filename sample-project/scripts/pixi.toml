# Pixi environment for the fixture project's Python tooling under scripts/.
# Mirrors the real layout: `cd scripts && pixi install` would create .pixi/
# (gitignored), which check-req.py looks for at scripts/.pixi/envs/default/.
[workspace]
name = "sample-project-scripts"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = ">=3.12"   # floor, not a pin
# E2E validator deps check-req.py probes for.
requests = "*"
jsonschema = "*"
pyyaml = "*"
